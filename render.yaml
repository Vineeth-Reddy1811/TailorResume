services:
  - type: web
    name: tailorresume
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run web:build && npm run server:build
    startCommand: node build/server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: hosted
      - key: NODE_VERSION
        value: 22.23.3
      - key: HOST
        value: 0.0.0.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: AI_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: TAILORRESUME_PLATFORM_AI_API_KEY
        sync: false
      - key: TAILORRESUME_PLATFORM_AI_MODEL
        sync: false
      - key: TAILORRESUME_INITIAL_AI_ACCESS_CODE
        sync: false
